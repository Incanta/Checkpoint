approvedGitRepositories:
  - "**"

enableScripts: true

nodeLinker: node-modules

# typescript-eslint refuses to load against TypeScript 7 ("typescript-eslint
# does not support TS 7.0") and its peer range is still >=4.8.4 <6.1.0, so with
# typescript@7 hoisted at the root every lint run dies before it starts.
#
# These extensions turn its peer on typescript into a real dependency pinned to
# the last 6.x release, so the linter gets its own nested copy while `tsc` stays
# on 7. Every package here reaches for the TypeScript API directly; listing only
# the meta package would leave the rest resolving 7 from the root.
#
# Two things make this work, and both look removable until lint breaks:
#   - the root workspace must NOT declare typescript, and there must be no
#     `typescript` entry in root resolutions. A peer a workspace can satisfy is
#     satisfied from there, and a resolution overrides everything, so either one
#     hands typescript-eslint the 7.x copy and these extensions do nothing.
#   - the workspaces that actually compile declare typescript ^7.0.2 themselves,
#     which is what hoists 7 to the root node_modules for `tsc` and for editors.
#
# DELETE ALL OF THIS once typescript-eslint supports TypeScript 7:
# https://github.com/typescript-eslint/typescript-eslint/issues/10940
packageExtensions:
  "typescript-eslint@*":
    dependencies:
      typescript: 6.0.3
  "@typescript-eslint/eslint-plugin@*":
    dependencies:
      typescript: 6.0.3
  "@typescript-eslint/parser@*":
    dependencies:
      typescript: 6.0.3
  "@typescript-eslint/project-service@*":
    dependencies:
      typescript: 6.0.3
  "@typescript-eslint/tsconfig-utils@*":
    dependencies:
      typescript: 6.0.3
  "@typescript-eslint/type-utils@*":
    dependencies:
      typescript: 6.0.3
  "@typescript-eslint/typescript-estree@*":
    dependencies:
      typescript: 6.0.3
  "@typescript-eslint/utils@*":
    dependencies:
      typescript: 6.0.3

npmMinimalAgeGate: 0
